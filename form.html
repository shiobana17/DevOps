<!DOCTYPE html>
<html>
<head>
  <title>Event Registration</title>
</head>
<body>

  <h2>Event Registration Form</h2>

  <form action="#" method="get" onsubmit="alert('Registration Successful!'); return false;">
    
    <label for="name">Full Name:</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label for="phone">Phone Number:</label><br>
    <input type="tel" id="phone" name="phone" required><br><br>

    <label>Gender:</label><br>
    <input type="radio" id="male" name="gender" value="male" required>
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label><br><br>

    <label for="event">Select Event:</label><br>
    <select id="event" name="event">
      <option value="coding">Coding Hackathon</option>
      <option value="robotics">Robotics Workshop</option>
      <option value="quiz">Tech Quiz</option>
    </select><br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Clear">

  </form>

</body>
</html>
